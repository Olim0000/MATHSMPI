name: Build LaTeX

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: xu-cheng/latex-action@v2
        with:
          root_file: Maths_MPI.tex
      - uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "Build LaTeX PDFs"
          file_pattern: "*.pdf"
